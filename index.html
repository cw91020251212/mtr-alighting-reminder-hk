<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b68"><link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><title>港鐵落車提醒</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#182536;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:18px 15px 42px}.hero{background:linear-gradient(135deg,#173b68,#087b73);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;line-height:1.55;opacity:.92}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #19324d12}.label{display:block;font-weight:700;margin:11px 0 6px}.select,.btn{width:100%;font:inherit;border-radius:12px;padding:12px;border:1px solid #d1dce7;background:#fff}.btn{border:0;background:#116c78;color:#fff;font-weight:700;margin-top:12px}.btn.secondary{background:#e8f1f3;color:#15545b}.btn.danger{background:#a94343}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{background:#eef5f7;border-radius:12px;padding:12px;line-height:1.6;margin-top:12px}.status.ok{background:#e6f7ed}.status.warn{background:#fff4dd}.muted{color:#68788a;font-size:13px;line-height:1.55}.hidden{display:none}.eta{font-size:31px;font-weight:800;color:#126f76}.route{background:#edf5f6;border-radius:12px;padding:11px;margin-top:12px;line-height:1.6}.seg{display:inline-block;padding:3px 8px;background:#fff;border-radius:99px;font-size:12px;margin:3px}.stations{display:flex;gap:7px;overflow:auto;padding:12px 2px 4px}.station{min-width:74px;text-align:center;font-size:12px;color:#718096}.station:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#cbd5df;margin:0 auto 5px;box-shadow:0 0 0 2px #cbd5df}.station.target{font-weight:800;color:#b24a28}.station.target:before{background:#f18b4d;box-shadow:0 0 0 2px #f18b4d}.footer{font-size:12px;color:#6f7d8d;line-height:1.6;margin-top:18px}
</style></head><body><main><section class="hero"><h1>港鐵落車提醒</h1><p>只需選擇上車站同落車站，程式會按全港鐵網絡自動計算路線及轉乘，不會將任何一條示例路線寫死。</p></section><section class="card" id="setup"><label class="label">上車站</label><select class="select" id="from"></select><label class="label">落車站</label><select class="select" id="to"></select><label class="label">提前提示</label><select class="select" id="lead"><option value="1">約 1 分鐘前</option><option value="2" selected>約 2 分鐘前</option><option value="3">約 3 分鐘前</option></select><button class="btn" id="start">計算路線並開始旅程</button><p class="muted">程式會選擇較少轉乘的路線。跨線旅程到轉乘站時會提示你，請按「已轉車」開始監察下一段。</p></section><section class="card hidden" id="journey"><h2 id="title"></h2><div class="route" id="route"></div><div class="status" id="state">準備中…</div><div class="stations" id="stations"></div><div class="status"><div class="muted" id="etaLabel">目前路段目的地 API 預計時間</div><div class="eta" id="eta">—</div><div id="detail">等待更新</div></div><button class="btn secondary hidden" id="next">已到轉乘站，開始下一段</button><button class="btn secondary" id="locate">開啟定位校正</button><button class="btn danger" id="stop">結束旅程</button></section><div class="footer">資料來源：香港鐵路有限公司 Next Train API（data.gov.hk）。只使用本地通知，不使用 Web Push。地下、鎖屏、省電模式或瀏覽器限制可能影響本地計時及定位，請以車站廣播及列車顯示為準。</div></main><script>
'use strict';
const API='https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php';
const LINES={
 EAL:['東鐵綫',['ADM:金鐘','EXC:會展','HUH:紅磡','MKK:旺角東','KOT:九龍塘','TAW:大圍','SHT:沙田','FOT:火炭','RAC:馬場','UNI:大學','TAP:大埔墟','TWO:太和','FAN:粉嶺','SHS:上水','LOW:羅湖','LMC:落馬洲']],
 TML:['屯馬綫',['WKS:烏溪沙','MOS:馬鞍山','HEO:恆安','TSH:大水坑','SHM:石門','CIO:第一城','STW:沙田圍','CKT:車公廟','TAW:大圍','HIK:顯徑','DIH:鑽石山','KAT:啟德','SUW:宋皇臺','TKW:土瓜灣','HOM:何文田','HUH:紅磡','ETS:尖東','AUS:柯士甸','NAC:南昌','MEF:美孚','TWW:荃灣西','KSR:錦上路','YUL:元朗','LOP:朗屏','TIS:天水圍','SIH:兆康','TUM:屯門']],
 TWL:['荃灣綫',['CEN:中環','ADM:金鐘','TST:尖沙咀','JOR:佐敦','YMT:油麻地','MOK:旺角','PRE:太子','SSP:深水埗','CSW:長沙灣','LCK:荔枝角','MEF:美孚','LAK:荔景','KWF:葵芳','KWH:葵興','TWH:大窩口','TSW:荃灣']],
 KTL:['觀塘綫',['WHA:黃埔','HOM:何文田','YMT:油麻地','MOK:旺角','PRE:太子','SKM:石硤尾','KOT:九龍塘','LOF:樂富','WTS:黃大仙','DIH:鑽石山','CHH:彩虹','KOB:九龍灣','NTK:牛頭角','KWT:觀塘','LAT:藍田','YAT:油塘','TIK:調景嶺']],
 TKL:['將軍澳綫',['NOP:北角','QUB:鰂魚涌','YAT:油塘','TIK:調景嶺','TKO:將軍澳','LHP:康城','HAH:坑口','POA:寶琳']],
 ISL:['港島綫',['KET:堅尼地城','HKU:香港大學','SYP:西營盤','SHW:上環','CEN:中環','ADM:金鐘','WAC:灣仔','CAB:銅鑼灣','TIH:天后','FOH:炮台山','NOP:北角','QUB:鰂魚涌','TAK:太古','SWH:西灣河','SKW:筲箕灣','HFC:杏花邨','CHW:柴灣']],
 TCL:['東涌綫',['HOK:香港','KOW:九龍','OLY:奧運','NAC:南昌','LAK:荔景','TSY:青衣','SUN:欣澳','TUC:東涌']],
 AEL:['機場快綫',['HOK:香港','KOW:九龍','TSY:青衣','AIR:機場','AWE:博覽館']],
 SIL:['南港島綫',['ADM:金鐘','OCP:海洋公園','WCH:黃竹坑','LET:利東','SOH:海怡半島']],
 DRL:['迪士尼綫',['SUN:欣澳','DIS:迪士尼']]
};
const $=id=>document.getElementById(id); const REVERSE=new Set(['TWL']); let trip=null,timer=null,watch=null,notifiedKey='';
const stationMap=new Map(), lineMap=new Map();
for(const [line,[label,raw]] of Object.entries(LINES)){const list=raw.map(x=>{const [code,name]=x.split(':');const s={code,name,line};if(!stationMap.has(code))stationMap.set(code,name);else if(!stationMap.get(code).includes(name))stationMap.set(code,stationMap.get(code)+'／'+name);return s});lineMap.set(line,list)}
const stations=[...stationMap.entries()].sort((a,b)=>a[1].localeCompare(b[1],'zh-Hant'));
const TRANSFERS={MKK:[['TWL','MOK']],MOK:[['EAL','MKK']],ADM:[['EAL','ADM'],['TWL','ADM'],['ISL','ADM'],['SIL','ADM']],HUH:[['EAL','HUH'],['TML','HUH']],TAW:[['EAL','TAW'],['TML','TAW']],KOT:[['EAL','KOT'],['KTL','KOT']],DIH:[['TML','DIH'],['KTL','DIH']],HOM:[['TML','HOM'],['KTL','HOM']],NAC:[['TML','NAC'],['TCL','NAC']],MEF:[['TML','MEF'],['TWL','MEF']],LAK:[['TCL','LAK'],['TWL','LAK']],SUN:[['TCL','SUN'],['DRL','SUN']],NOP:[['ISL','NOP'],['TKL','NOP']],QUB:[['ISL','QUB'],['TKL','QUB']],YAT:[['KTL','YAT'],['TKL','YAT']],TIK:[['KTL','TIK'],['TKL','TIK']]};
function fillStations(){const opts=stations.map(([c,n])=>`<option value="${c}">${n}（${c}）</option>`).join('');$('from').innerHTML=opts;$('to').innerHTML=opts;const f=stations.findIndex(x=>x[0]==='TAP'),t=stations.findIndex(x=>x[0]==='TSW');if(f>=0)$('from').selectedIndex=f;if(t>=0)$('to').selectedIndex=t}
function adjacent(state){const list=lineMap.get(state.line),i=list.findIndex(x=>x.code===state.code),out=[];if(i>0)out.push({code:list[i-1].code,line:state.line});if(i+1<list.length)out.push({code:list[i+1].code,line:state.line});for(const [line,other] of lineMap){if(line!==state.line&&other.some(x=>x.code===state.code))out.push({code:state.code,line})}for(const [line,code] of (TRANSFERS[state.code]||[])){if(line!==state.line)out.push({code,line})}return out}
function routeBetween(from,to){if(from===to)return [];const q=[{code:from,line:null,cost:0,path:[{code:from,line:null}]}],best=new Map();while(q.length){q.sort((a,b)=>a.cost-b.cost||a.path.length-b.path.length);const cur=q.shift();if(cur.code===to&&cur.path.length>1)return mergeSegments(cur.path);const key=cur.code+'|'+(cur.line||'');if(best.has(key)&&best.get(key)<=cur.cost)continue;best.set(key,cur.cost);const states=cur.line?adjacent(cur):[...lineMap].filter(([,xs])=>xs.some(x=>x.code===cur.code)).map(([line])=>({code:cur.code,line}));for(const n of states){const transfer=cur.line&&cur.line!==n.line?100:0;q.push({code:n.code,line:n.line,cost:cur.cost+transfer+1,path:cur.path.concat(n)});}}return null}
function mergeSegments(path){const segs=[];let start=null,line=null,from=null;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];if(a.line!==b.line){if(line)segs.push({line,from,to:a.code});line=b.line;from=b.code;continue}if(!line){line=b.line;from=a.code}if(i===path.length-1)segs.push({line,from,to:b.code})}return segs.filter(x=>x.from!==x.to)}
function lineName(line){return LINES[line][0]} function lineStations(line){return lineMap.get(line)} function stationName(code){return stationMap.get(code)||code}
function direction(seg){const xs=lineStations(seg.line),a=xs.findIndex(x=>x.code===seg.from),b=xs.findIndex(x=>x.code===seg.to),forward=b>a;return (REVERSE.has(seg.line)?!forward:forward)?'UP':'DOWN'}
function status(t,k=''){$('state').className='status '+k;$('state').innerHTML=t} function localTime(s){return new Date(String(s).replace(' ','T')+'+08:00')} function fmt(d){return d.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}
function renderRoute(){ $('route').innerHTML=trip.segments.map((s,i)=>`<span class="seg">第${i+1}段：${lineName(s.line)} ${stationName(s.from)} → ${stationName(s.to)}</span>`).join(' → ') }
function renderStations(){const s=trip.segments[trip.active],xs=lineStations(s.line),a=xs.findIndex(x=>x.code===s.from),b=xs.findIndex(x=>x.code===s.to),lo=Math.min(a,b),hi=Math.max(a,b);$('stations').innerHTML=xs.slice(lo,hi+1).map(x=>`<div class="station ${x.code===s.to?'target':''}">${x.name}</div>`).join('')}
async function api(seg,code){const r=await fetch(`${API}?line=${seg.line}&sta=${code}&lang=TC`,{cache:'no-store'});if(!r.ok)throw Error('API HTTP '+r.status);return r.json()}
function rows(payload,seg){const key=Object.keys(payload.data||{})[0],block=key?payload.data[key]:{};return (block?.[direction(seg)]||[]).filter(x=>x.valid!=='N'&&x.time)}
function notify(title,body){if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);if('Notification'in window&&Notification.permission==='granted')navigator.serviceWorker?.ready.then(r=>r.active?.postMessage({type:'MTR_LOCAL_ALERT',title,body,tag:'mtr-local-'+Date.now()})).catch(()=>{});alert(`${title}\n${body}`)}
async function refresh(){if(!trip)return;const seg=trip.segments[trip.active];try{const dest=await api(seg,seg.to),next=rows(dest,seg).map(x=>({...x,at:localTime(x.time)})).find(x=>x.at.getTime()>Date.now()-120000);if(!next){$('eta').textContent='暫無資料';$('detail').textContent='港鐵暫時未提供此方向班次';return}const min=Math.max(0,Math.round((next.at-Date.now())/60000));$('eta').textContent=min<=0?'即將到達':`約 ${min} 分鐘`;$('detail').innerHTML=`預計 ${fmt(next.at)} 到 ${stationName(seg.to)} · 目的地 ${next.dest||''}<br>${lineName(seg.line)} · ${direction(seg)} 方向 · API ${fmt(localTime(dest.curr_time||dest.sys_time))}`;status(`第 ${trip.active+1}/${trip.segments.length} 段：${stationName(seg.from)} → ${stationName(seg.to)}`,'ok');const key=trip.active+':'+next.time;if(min<=trip.lead&&notifiedKey!==key){notifiedKey=key;if(trip.active===trip.segments.length-1)notify(`準備落車：${stationName(seg.to)}`,`約 ${min} 分鐘後到達 ${stationName(seg.to)}`);else{notify(`準備轉車：${stationName(seg.to)}`,`到站後請轉乘下一段 ${lineName(trip.segments[trip.active+1].line)}`);$('next').classList.remove('hidden')}}}catch(e){status(`港鐵 API 暫時讀取失敗：${e.message}，稍後重試。`,'warn')}}
async function start(){const segs=routeBetween($('from').value,$('to').value);if(!segs){status('暫時搵唔到兩個站之間嘅路線。','warn');return}trip={segments:segs,active:0,lead:+$('lead').value};notifiedKey='';$('setup').classList.add('hidden');$('journey').classList.remove('hidden');$('title').textContent=`${stationName($('from').value)} → ${stationName($('to').value)}`;renderRoute();renderStations();if('Notification'in window&&Notification.permission==='default')try{await Notification.requestPermission()}catch{}refresh();timer=setInterval(refresh,20000)}
function nextSegment(){if(!trip||trip.active>=trip.segments.length-1)return;trip.active++;notifiedKey='';$('next').classList.add('hidden');renderStations();refresh()}
function stop(){if(timer)clearInterval(timer);timer=null;if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;trip=null;$('journey').classList.add('hidden');$('setup').classList.remove('hidden')}
function locate(){if(!navigator.geolocation){status('此裝置不支援定位；會繼續用 API 及行程推算。','warn');return}if(watch!==null)return;watch=navigator.geolocation.watchPosition(p=>status(`定位已開啟（準確度約 ${Math.round(p.coords.accuracy)} 米）；港鐵 API 仍作主要依據。`,'ok'),()=>status('定位暫時未能使用；程式改用 API 及行程推算。','warn'),{enableHighAccuracy:true,maximumAge:15000,timeout:12000})}
$('start').onclick=start;$('next').onclick=nextSegment;$('stop').onclick=stop;$('locate').onclick=locate;fillStations();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
